# Card definitions for Core Set, Colony Wars, and Frontiers.
#
# Hand-authored; the engine reads only this file and data/sets.toml.
# `id` matches the official gallery id (and assets/cards/<id>.webp).
# cost/defense/outpost/faction/kind are checked against data/upstream/review.csv
# by the sr-core test suite.
#
# Abilities are lists of effects:
#   primary  ship: resolves on play.  base: usable once per turn.
#   ally     needs another in-play card of this card's faction.
#   ally2    "double ally": needs two other cards of the faction.
#   scrap    remove this card from play to the scrap heap, then resolve.
#
# Effects:
#   { trade = n } { combat = n } { authority = n } { draw = n } { opp_discard = n }
#   { choose = [[...], [...]] }                      pick one list
#   { scrap = { from, min = 0, max = 1, reward } }   from: hand | discard | hand_or_discard | trade_row
#                                                    reward: "draw_each" | "combat_cost" | { combat_each = n }
#   { discard = { min = 0, max = 1, reward } }       reward: "draw_each" | { combat_each = n } | { trade_or_combat_each = n }
#   "destroy_base"                                   may destroy any opponent base (ignores outposts)
#   { acquire = { max_cost, filter = "any", dest = "discard" } }   free acquire; filter: any | ship | base | ship_or_base
#   { next_acquire = { filter, dest, may = false } } dest: top_deck | hand
#   { when = { cond, then = [...] } }                cond: "opp_has_base" | { own_bases_at_least = n }
#   { draw_per_played = faction }                    Blob World
#   { combat_per_scrapped_own = n }                  Reclamation Station
#   { combat_per_scrapped = n }                      The Incinerator (hand/discard scraps this turn)
#   "topdeck_base"                                   Repair Mech
#   "copy_ship" | "copy_base"                        Stealth Needle / Stealth Tower
#
# Card-level flags:
#   ally_all = true                  counts as an ally of every faction (Mech World)
#   on_ship_played = { faction, combat }
#   acquire_to_hand = true           on acquire, to hand if a card of this faction was played this turn
#   returns_from_scrap = true        Mobile Market

