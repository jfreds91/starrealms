[workspace]
resolver = "2"
members = ["crates/sr-core", "crates/sr-bots", "crates/sr-py", "crates/sr-wasm", "crates/sr-server"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sr-core = { path = "crates/sr-core" }
sr-bots = { path = "crates/sr-bots" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
