[package]
name = "sr-bots"
edition.workspace = true
version.workspace = true
description = "Scripted Star Realms agents"

[features]
default = ["candle"]
# Entity-transformer models (`.safetensors`); MLP models (`.srnn`) need nothing extra.
candle = ["dep:candle-core", "dep:candle-nn", "dep:safetensors"]

[dependencies]
sr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
candle-core = { version = "0.11", default-features = false, optional = true }
candle-nn = { version = "0.11", default-features = false, optional = true }
safetensors = { version = "0.8", optional = true }
