[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "starrealms"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
train = ["torch"]

[tool.maturin]
python-source = "../../python"
module-name = "starrealms._engine"
