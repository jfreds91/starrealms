[package]
name = "sr-wasm"
edition.workspace = true
version.workspace = true
description = "The Star Realms engine and bots for the browser (hot-seat, offline, replays)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sr-core.workspace = true
sr-bots.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# candle (entity models) depends on `rand`; the browser has no OS entropy source.
getrandom = { version = "0.3", features = ["wasm_js"] }
