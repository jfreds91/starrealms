<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 456" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Left to right: input tokens, four transformer layers, a final LayerNorm, then the win-chance, untargeted-action, and pointer heads.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.2 5 L 0 8.8 Z" fill="#8aa4c8"/>
    </marker>
    <symbol id="block" width="138" height="304">
      <rect width="138" height="304" rx="10" fill="#182033" stroke="rgba(140,170,220,0.45)" stroke-width="1.25"/>
      <rect x="30" y="46" width="96" height="56" rx="6" fill="#10182a" stroke="rgba(140,170,220,0.35)"/>
      <text x="78" y="68" fill="#d5deee" font-size="12" text-anchor="middle">LayerNorm</text>
      <text x="78" y="86" fill="#d5deee" font-size="12" text-anchor="middle">Attn × 8</text>
      <path d="M 16 46 V 118 H 69" fill="none" stroke="#6cb6ff" stroke-width="1.25"/>
      <path d="M 78 102 V 109" fill="none" stroke="#8aa4c8" stroke-width="1.25" marker-end="url(#arrow)"/>
      <circle cx="78" cy="120" r="9" fill="#182033" stroke="#6cb6ff" stroke-width="1.25"/>
      <text x="78" y="124" fill="#e6ecf7" font-size="13" font-weight="700" text-anchor="middle">+</text>
      <rect x="30" y="186" width="96" height="56" rx="6" fill="#10182a" stroke="rgba(140,170,220,0.35)"/>
      <text x="78" y="208" fill="#d5deee" font-size="12" text-anchor="middle">LayerNorm</text>
      <text x="78" y="226" fill="#d5deee" font-size="12" text-anchor="middle">FFN · 1024</text>
      <path d="M 16 186 V 268 H 69" fill="none" stroke="#6cb6ff" stroke-width="1.25"/>
      <path d="M 78 242 V 258" fill="none" stroke="#8aa4c8" stroke-width="1.25" marker-end="url(#arrow)"/>
      <circle cx="78" cy="270" r="9" fill="#182033" stroke="#6cb6ff" stroke-width="1.25"/>
      <text x="78" y="274" fill="#e6ecf7" font-size="13" font-weight="700" text-anchor="middle">+</text>
      <path d="M 78 129 V 186" fill="none" stroke="#8aa4c8" stroke-width="1.25" marker-end="url(#arrow)"/>
    </symbol>
  </defs>

  <rect width="1080" height="456" rx="16" fill="#10182a"/>

  <text x="16" y="32" fill="#8d9ab3" font-size="12" font-weight="600" style="letter-spacing: 0.12em">INPUT TOKENS</text>
  <text x="481" y="32" fill="#8d9ab3" font-size="12" font-weight="600" text-anchor="middle" style="letter-spacing: 0.12em">TRANSFORMER LAYERS</text>
  <text x="842" y="32" fill="#8d9ab3" font-size="12" font-weight="600" style="letter-spacing: 0.12em">HEADS</text>

  <!-- tokens -->
  <rect x="16" y="52" width="156" height="304" rx="10" fill="#182033" stroke="rgba(140,170,220,0.45)" stroke-width="1.25"/>
  <g font-size="13" font-weight="600" fill="#e6ecf7">
    <rect x="28" y="68" width="4" height="22" rx="2" fill="#f2b84b"/>
    <text x="40" y="84">Summary</text>
    <rect x="28" y="104" width="4" height="22" rx="2" fill="#8caadc"/>
    <text x="40" y="120">Zone totals</text>
    <rect x="28" y="140" width="4" height="22" rx="2" fill="#6cb6ff"/>
    <text x="40" y="156">In play</text>
    <rect x="28" y="176" width="4" height="22" rx="2" fill="#ff6b5e"/>
    <text x="40" y="192">Enemy bases</text>
    <rect x="28" y="212" width="4" height="22" rx="2" fill="#f2c14e"/>
    <text x="40" y="228">Trade row</text>
    <rect x="28" y="248" width="4" height="22" rx="2" fill="#9aa4b8"/>
    <text x="40" y="264">Explorers</text>
    <rect x="28" y="284" width="4" height="22" rx="2" fill="#47d18c"/>
    <text x="40" y="300">Hand</text>
    <rect x="28" y="320" width="4" height="22" rx="2" fill="#c18cff"/>
    <text x="40" y="336">Discard</text>
  </g>
  <g font-size="11" fill="#8d9ab3">
    <text x="160" y="84" text-anchor="end">1</text>
    <text x="160" y="120" text-anchor="end">9</text>
    <text x="160" y="156" text-anchor="end">each</text>
    <text x="160" y="192" text-anchor="end">each</text>
    <text x="160" y="228" text-anchor="end">5</text>
    <text x="160" y="264" text-anchor="end">1</text>
    <text x="160" y="300" text-anchor="end">≤12</text>
    <text x="160" y="336" text-anchor="end">≤32</text>
  </g>

  <!-- bracket into the first layer -->
  <path d="M 176 64 H 182 V 344 H 176" fill="none" stroke="#8aa4c8" stroke-width="1.25"/>
  <path d="M 182 204 H 186" fill="none" stroke="#8aa4c8" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- four identical layers -->
  <use href="#block" x="188" y="52"/>
  <use href="#block" x="342" y="52"/>
  <use href="#block" x="496" y="52"/>
  <use href="#block" x="650" y="52"/>
  <g fill="#6cb6ff" font-size="14" font-weight="700" text-anchor="middle">
    <text x="257" y="78">Layer 1</text>
    <text x="411" y="78">Layer 2</text>
    <text x="565" y="78">Layer 3</text>
    <text x="719" y="78">Layer 4</text>
  </g>
  <path d="M 326 204 H 340" fill="none" stroke="#8aa4c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 480 204 H 494" fill="none" stroke="#8aa4c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 634 204 H 648" fill="none" stroke="#8aa4c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- final LayerNorm, then the heads -->
  <path d="M 788 204 H 804" fill="none" stroke="#8aa4c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="806" y="52" width="28" height="304" rx="8" fill="#182033" stroke="#6cb6ff" stroke-width="1.25"/>
  <text x="820" y="204" fill="#e6ecf7" font-size="13" font-weight="600" text-anchor="middle" transform="rotate(-90 820 204)">LayerNorm</text>

  <path d="M 834 204 H 846" fill="none" stroke="#8aa4c8" stroke-width="1.5"/>
  <path d="M 846 96 V 304" fill="none" stroke="#8aa4c8" stroke-width="1.5"/>
  <path d="M 846 96 H 858" fill="none" stroke="#8aa4c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 846 196 H 858" fill="none" stroke="#8aa4c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 846 304 H 858" fill="none" stroke="#8aa4c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g fill="#182033" stroke-width="1.25">
    <rect x="860" y="52" width="204" height="88" rx="10" stroke="#47d18c"/>
    <rect x="860" y="152" width="204" height="88" rx="10" stroke="#ff8a5b"/>
    <rect x="860" y="252" width="204" height="104" rx="10" stroke="#c18cff"/>
  </g>
  <g fill="#e6ecf7" font-size="14" font-weight="700">
    <text x="874" y="80">Win chance</text>
    <text x="874" y="180">Untargeted</text>
    <text x="874" y="280">Pointer</text>
  </g>
  <g fill="#a9b6cc" font-size="12">
    <text x="874" y="102">summary token</text>
    <text x="874" y="120">256 → GELU → 1</text>
    <text x="874" y="202">end · skip · choose</text>
    <text x="874" y="220">attack the player</text>
    <text x="874" y="302">14 queries from the summary</text>
    <text x="874" y="320">score = query · key / √256</text>
    <text x="874" y="338">hand, row, in play, bases</text>
  </g>

  <text x="16" y="388" fill="#8d9ab3" font-size="12">Each layer is 256 wide. Attention is eight heads of 32. The feed-forward layer is 256 → 1024 → GELU → 256. The skip around each block is the residual add.</text>
  <text x="16" y="410" fill="#8d9ab3" font-size="12">A card vector is a learned id plus the printed card, and a type id marks the group. Every real token attends to every other. Empty slots are left out.</text>
  <text x="16" y="432" fill="#8d9ab3" font-size="12">All three heads read the summary token. The pointer scores a card in the group that move needs: hand, trade row, in play, or an enemy base.</text>
</svg>
